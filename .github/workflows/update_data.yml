   name: Update USGS Data

   on:
     schedule:
       - cron: '0 6 * * *'
     workflow_dispatch:

   jobs:
     update-data:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: r-lib/actions/setup-r@v2

         - name: Install R packages
           run: |
             install.packages(c("dataRetrieval", "tidyverse"))
           shell: Rscript {0}

         - name: Run data update script
           run: Rscript update_wq_data.R

         - name: Commit and push updated data
           run: |
             git config user.name "github-actions"
             git config user.email "actions@github.com"
             git add data/current_wq_data.csv
             git commit -m "Auto-update USGS data" || echo "No changes to commit"
             git push
